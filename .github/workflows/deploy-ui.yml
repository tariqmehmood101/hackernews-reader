name: deploy-ui

# Deploys the Angular app to Azure Static Web Apps.
#
# Requires one secret: AZURE_SWA_DEPLOYMENT_TOKEN. Until it exists the job is skipped rather
# than failed, so a missing deployment target never reddens the repo.
on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/deploy-ui.yml'
  workflow_dispatch:

jobs:
  deploy:
    name: Build and deploy UI
    runs-on: ubuntu-latest
    # Secrets live in this environment rather than at repository level.
    environment: DEV

    steps:
      - uses: actions/checkout@v4

      - name: Skip if no deployment token is configured
        id: guard
        run: |
          if [ -z "${{ secrets.AZURE_SWA_DEPLOYMENT_TOKEN }}" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::AZURE_SWA_DEPLOYMENT_TOKEN is not set — skipping deployment."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Node
        if: steps.guard.outputs.configured == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        if: steps.guard.outputs.configured == 'true'
        working-directory: frontend
        run: npm ci

      - name: Unit tests
        if: steps.guard.outputs.configured == 'true'
        working-directory: frontend
        run: npm run test:ci

      - name: Build
        if: steps.guard.outputs.configured == 'true'
        working-directory: frontend
        run: npm run build:prod

      # skip_app_build: the bundle is already built above, so the action only uploads it.
      # staticwebapp.config.json travels with the artifact and supplies the CSP and SPA fallback.
      - name: Deploy to Static Web Apps
        if: steps.guard.outputs.configured == 'true'
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_SWA_DEPLOYMENT_TOKEN }}
          action: upload
          app_location: frontend/dist/frontend/browser
          config_file_location: frontend
          skip_app_build: true
